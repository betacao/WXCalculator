<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabBar 图标生成器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 10px;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 40px;
      font-size: 16px;
    }

    .icons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .icon-card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      transition: transform 0.3s ease;
    }

    .icon-card:hover {
      transform: translateY(-5px);
    }

    .icon-preview {
      width: 81px;
      height: 81px;
      margin: 0 auto 20px;
      border: 2px solid #f0f0f0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
    }

    canvas {
      display: block;
    }

    .icon-name {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
    }

    .download-btn {
      background: #4fc08d;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
    }

    .download-btn:hover {
      background: #3aa876;
      transform: scale(1.05);
    }

    .download-btn:active {
      transform: scale(0.95);
    }

    .download-all {
      text-align: center;
      margin-top: 30px;
    }

    .download-all-btn {
      background: white;
      color: #4fc08d;
      border: 2px solid white;
      padding: 16px 48px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .download-all-btn:hover {
      background: #4fc08d;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .instructions {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-top: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .instructions h2 {
      color: #4fc08d;
      margin-bottom: 20px;
      font-size: 24px;
    }

    .instructions ol {
      padding-left: 20px;
      line-height: 1.8;
      color: #666;
    }

    .instructions li {
      margin-bottom: 10px;
    }

    .instructions code {
      background: #f5f5f5;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      color: #e83e8c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 TabBar 图标生成器</h1>
    <p class="subtitle">食物含水量计算器 - 专属图标</p>

    <div class="icons-grid" id="iconsGrid"></div>

    <div class="download-all">
      <button class="download-all-btn" onclick="downloadAll()">📦 一键下载全部图标</button>
    </div>

    <div class="instructions">
      <h2>📋 使用说明</h2>
      <ol>
        <li>点击每个图标下方的"下载"按钮，或点击"一键下载全部图标"</li>
        <li>将下载的图标文件放入项目的 <code>images/</code> 目录</li>
        <li>确保文件名与配置一致（不要修改文件名）</li>
        <li>在微信开发者工具中编译运行即可看到效果</li>
        <li>如果图标不显示，尝试清除缓存并重新编译</li>
      </ol>
    </div>
  </div>

  <script>
    const icons = [
      {
        name: 'calculator.png',
        title: '计算器（未选中）',
        color: '#999999',
        draw: drawCalculator
      },
      {
        name: 'calculator-active.png',
        title: '计算器（选中）',
        color: '#4fc08d',
        draw: drawCalculator
      },
      {
        name: 'profile.png',
        title: '个人中心（未选中）',
        color: '#999999',
        draw: drawProfile
      },
      {
        name: 'profile-active.png',
        title: '个人中心（选中）',
        color: '#4fc08d',
        draw: drawProfile
      },
      {
        name: 'login.png',
        title: '登录页图标',
        color: '#4fc08d',
        draw: drawLogin
      }
    ];

    // 绘制计算器图标
    function drawCalculator(ctx, color) {
      const size = 81;
      ctx.clearRect(0, 0, size, size);

      // 外框
      ctx.fillStyle = color;
      ctx.beginPath();
      roundRect(ctx, 16, 12, 49, 57, 6);
      ctx.fill();

      // 显示屏
      ctx.fillStyle = 'white';
      ctx.beginPath();
      roundRect(ctx, 22, 18, 37, 14, 3);
      ctx.fill();

      // 按钮（4x4网格）
      const buttonSize = 7;
      const gap = 3;
      const startX = 22;
      const startY = 38;

      for (let row = 0; row < 4; row++) {
        for (let col = 0; col < 4; col++) {
          ctx.fillStyle = 'white';
          ctx.globalAlpha = 0.9;
          ctx.beginPath();
          roundRect(
            ctx,
            startX + col * (buttonSize + gap),
            startY + row * (buttonSize + gap),
            buttonSize,
            buttonSize,
            2
          );
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    }

    // 绘制个人中心图标
    function drawProfile(ctx, color) {
      const size = 81;
      ctx.clearRect(0, 0, size, size);

      // 头部（圆形）
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(40.5, 28, 12, 0, Math.PI * 2);
      ctx.fill();

      // 身体（梯形）
      ctx.beginPath();
      ctx.moveTo(28, 65);
      ctx.lineTo(53, 65);
      ctx.lineTo(60, 48);
      ctx.quadraticCurveTo(55, 42, 40.5, 42);
      ctx.quadraticCurveTo(26, 42, 21, 48);
      ctx.closePath();
      ctx.fill();
    }

    // 绘制登录图标（水滴形状，符合含水量主题）
    function drawLogin(ctx, color) {
      const size = 81;
      ctx.clearRect(0, 0, size, size);

      // 大水滴
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(40.5, 15);
      ctx.quadraticCurveTo(55, 30, 55, 45);
      ctx.quadraticCurveTo(55, 60, 40.5, 60);
      ctx.quadraticCurveTo(26, 60, 26, 45);
      ctx.quadraticCurveTo(26, 30, 40.5, 15);
      ctx.closePath();
      ctx.fill();

      // 小水滴装饰
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.arc(50, 24, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(31, 24, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // 水滴内高光
      ctx.fillStyle = 'white';
      ctx.globalAlpha = 0.3;
      ctx.beginPath();
      ctx.ellipse(37, 35, 8, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // 圆角矩形辅助函数
    function roundRect(ctx, x, y, width, height, radius) {
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    // 创建并显示图标
    function createIcons() {
      const grid = document.getElementById('iconsGrid');

      icons.forEach((icon, index) => {
        const card = document.createElement('div');
        card.className = 'icon-card';

        const preview = document.createElement('div');
        preview.className = 'icon-preview';

        const canvas = document.createElement('canvas');
        canvas.width = 81;
        canvas.height = 81;
        canvas.id = `canvas-${index}`;

        const ctx = canvas.getContext('2d');
        icon.draw(ctx, icon.color);

        preview.appendChild(canvas);

        const name = document.createElement('div');
        name.className = 'icon-name';
        name.textContent = icon.title;

        const btn = document.createElement('button');
        btn.className = 'download-btn';
        btn.textContent = '下载图标';
        btn.onclick = () => downloadIcon(canvas, icon.name);

        card.appendChild(preview);
        card.appendChild(name);
        card.appendChild(btn);

        grid.appendChild(card);
      });
    }

    // 下载单个图标
    function downloadIcon(canvas, filename) {
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 'image/png');
    }

    // 下载所有图标
    function downloadAll() {
      icons.forEach((icon, index) => {
        setTimeout(() => {
          const canvas = document.getElementById(`canvas-${index}`);
          downloadIcon(canvas, icon.name);
        }, index * 300); // 延迟下载，避免浏览器阻止
      });
    }

    // 页面加载时创建图标
    window.onload = createIcons;
  </script>
</body>
</html>
